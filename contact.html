
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Reasat Safin | Contact</title>

  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .social-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 2.5vw, 22px);
      width: 100%;
      padding: 38px 0 90px;
    }

    .social-row a {
      display: flex;
      flex: 0 1 78px;
      align-items: center;
      justify-content: center;
      width: 78px;
      min-width: 0;
      height: 78px;
      padding: 0;
      overflow: hidden;
      border: 1px solid #37373e;
      border-radius: 20px;
      background: linear-gradient(145deg, #1a1b20, #101114);
      color: #f5f3ef;
      font-size: 28px;
      line-height: 1;
      text-decoration: none;
      transition: transform .2s ease, color .2s ease, border-color .2s ease;
    }

    .social-row a i {
      display: block;
      flex-shrink: 0;
      font-size: inherit;
      line-height: 1;
    }

    .social-row a:hover {
      transform: translateY(-4px);
    }

    .social-row a.email:hover {
      color: #e8c879;
      border-color: #e8c879;
    }

    .social-row a.fb:hover {
      color: #1877f2;
      border-color: #1877f2;
    }

    .social-row a.ig:hover {
      color: #e4405f;
      border-color: #e4405f;
    }

    .social-row a.wa:hover {
      color: #25d366;
      border-color: #25d366;
    }

    .social-row a.tg:hover {
      color: #2aabee;
      border-color: #2aabee;
    }

    @media (max-width: 600px) {
      .social-row {
        gap: 8px;
        padding: 30px 0 60px;
      }

      .social-row a {
        flex: 1 1 0;
        width: auto;
        max-width: 62px;
        height: auto;
        aspect-ratio: 1 / 1;
        border-radius: 16px;
        font-size: clamp(20px, 6vw, 25px);
      }
    }

    @media (max-width: 350px) {
      .social-row {
        gap: 5px;
      }

      .social-row a {
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
<div class="site-shell">

  <header>
    <nav>
      <a class="brand" href="index.html">Reasat Safin</a>

      <div class="links">
        <a href="index.html" data-page="home">Home</a>
        <a href="education.html" data-page="education">Education</a>
        <a href="skills.html" data-page="skills">Skills</a>
        <a href="gallery.html" data-page="gallery">Gallery</a>
        <a href="contact.html" data-page="contact">Contact</a>
        <a href="about.html" data-page="about">About Me</a>
      </div>

      <button class="owner" id="loginBtn">Owner Login ♙</button>
    </nav>
  </header>

  <main>
    <div class="page-intro center">
      <div class="eyebrow">Get in touch</div>
      <h2>Feel Free to Contact</h2>
      <p class="lead">Tap any icon to connect with me directly.</p>
    </div>

    <div class="social-row">

      <!-- 1. EMAIL: icon only -->
      <a class="email"
         id="emailView"
         href="mailto:reasatsafin@gmail.com"
         aria-label="Email"
         title="Email">
        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
      </a>

      <!-- 2. FACEBOOK -->
      <a class="fb"
         id="facebookView"
         href="https://facebook.com/reasat.safin"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Facebook"
         title="Facebook">
        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
      </a>

      <!-- 3. INSTAGRAM -->
      <a class="ig"
         id="instagramView"
         href="https://instagram.com/_r._s._001"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Instagram"
         title="Instagram">
        <i class="fa-brands fa-instagram" aria-hidden="true"></i>
      </a>

      <!-- 4. WHATSAPP -->
      <a class="wa"
         id="whatsappView"
         href="https://wa.me/+8801715663944"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="WhatsApp"
         title="WhatsApp">
        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
      </a>

      <!-- 5. TELEGRAM -->
      <a class="tg"
         id="telegramView"
         href="https://t.me/ReasatSafin101"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Telegram"
         title="Telegram">
        <i class="fa-brands fa-telegram" aria-hidden="true"></i>
      </a>

    </div>

    <footer>
      <span>© <span id="yearView"></span> Reasat Safin</span>
    </footer>
  </main>
</div>

<button class="btn" id="editBtn">Edit Profile</button>

<div id="lightbox">
  <span>×</span>
  <img alt="Expanded gallery photo">
</div>

<dialog id="loginDialog">
  <div class="modal">
    <h2>Owner Login</h2>
    <p class="muted-note">Use your existing Supabase account.</p>

    <div class="form">
      <label>Email
        <input id="loginEmail" type="email" autocomplete="username">
      </label>

      <label>Password
        <input id="loginPassword" type="password" autocomplete="current-password">
      </label>

      <div class="error" id="loginError"></div>
    </div>

    <div class="modal-actions">
      <button class="btn outline" id="cancelLogin">Cancel</button>
      <button class="btn" id="loginSubmit">Login</button>
    </div>
  </div>
</dialog>

<dialog id="editDialog">
  <div class="modal">
    <h2>Edit Portfolio</h2>

    <div class="form">
      <label>Display name
        <input id="fName">
      </label>

      <label>Intro
        <textarea id="fIntro"></textarea>
      </label>

      <label>About
        <textarea id="fAbout"></textarea>
      </label>

      <label>Education — School
        <textarea id="fEdu1"></textarea>
      </label>

      <label>Education — College / Current studies
        <textarea id="fEdu2"></textarea>
      </label>

      <label>Education — Goals
        <textarea id="fEdu3"></textarea>
      </label>

      <label>Portrait image URL (direct HTTPS)
        <input id="fImage">
      </label>

      <label>Gallery image URLs (one HTTPS URL per line)
        <textarea id="fGallery"></textarea>
      </label>

      <label>School image URL
        <input id="fSchoolImage">
      </label>

      <label>College image URL
        <input id="fCollegeImage">
      </label>

      <label>Skills (one per line, format: Name | 85)
        <textarea id="fSkills" placeholder="HTML &amp; CSS | 90&#10;JavaScript | 75&#10;Python | 60"></textarea>
      </label>

      <label>Email
        <input id="fEmail" type="email" value="reasatsafin@gmail.com">
      </label>

      <label>Facebook URL
        <input id="fFacebook" value="https://facebook.com/reasat.safin">
      </label>

      <label>Instagram URL
        <input id="fInstagram" value="https://instagram.com/_r._s._001">
      </label>

      <label>Telegram URL
        <input id="fTelegram" value="https://t.me/ReasatSafin101">
      </label>

      <div class="error" id="saveError"></div>
    </div>

    <div class="modal-actions">
      <button class="btn outline" id="logoutBtn">Logout</button>
      <button class="btn outline" id="cancelEdit">Cancel</button>
      <button class="btn" id="saveBtn">Save changes</button>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>

</body>
</html>
